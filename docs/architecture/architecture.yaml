# Design AI Architecture DSL
# Source of truth — see Architecture Bible Part 23
# Human-readable docs: docs/Architecture_Bible.md (secondary)

version: "1.0"

project:
  architecture: "2.0"
  runtime: RuntimeV2
  provider: Flux
  mode: Enterprise

architecture:
  score_target: 98
  coverage_target: 95
  laws:
    - LAW-001  # Prompt is NOT source of truth
    - LAW-021
    - LAW-022
    - LAW-031  # Every folder has one responsibility
    - LAW-032  # No business logic outside Platforms
    - LAW-033  # No platform code inside Providers
    - LAW-034  # No Runtime code inside Platforms
    - LAW-035  # Repository structure is architecture
    - LAW-036  # ProjectState is immutable
    - LAW-037  # Every platform owns exactly one responsibility
    - LAW-038  # No platform communicates directly with another platform
    - LAW-039  # Only Runtime orchestrates execution
    - LAW-040  # Only Provider Adapter generates prompts
    - LAW-041  # Only Asset Platform accesses filesystem
    - LAW-042  # Knowledge queried only through Knowledge Engine
    - LAW-043  # Rendering executes blueprints only
    - LAW-044  # Vision is mandatory
    - LAW-045  # Learning executes after every completed generation
    - LAW-046  # Every architectural change requires ADR
    - LAW-047  # Every breaking change requires RFC
    - LAW-048  # Every implementation requires Directive
    - LAW-049  # Architecture validation blocks invalid releases
    - LAW-050  # Architecture Bible is the single source of truth
  law_count: 50

repository:
  root: marketplace-infographic/
  src: marketplace-infographic/src/
  layers:
    - name: application
      path: src/app/
      responsibilities:
        - Next.js routes
        - API
        - UI
        - Authentication
      forbidden:
        - business_logic
        - rendering
        - knowledge
        - commercial

    - name: components
      path: src/components/
      responsibilities:
        - reusable UI
      forbidden:
        - platform_logic
        - business_logic

    - name: lib
      path: src/lib/
      responsibilities:
        - entire Design AI OS
      subdirectories:
        - platform-core
        - runtime
        - contracts
        - platforms
        - providers
        - sdk
        - assets
        - legacy

  platforms:
    path: src/lib/platforms/
    modules:
      - Research
      - Knowledge
      - Commercial
      - Creative
      - Visual
      - Rendering
      - Vision
      - Learning
      - Governance

  providers:
    path: src/lib/providers/
    interface: IProvider
    implementations:
      - Flux
      - GPTImage
      - Imagen
      - StableDiffusion

  legacy:
    path: src/lib/legacy/
    purpose: compatibility only
    forbidden:
      - new_code
    migrate_from:
      - design-process
      - render-engine
      - prompt
      - design-governance
      - design
      - feedback
      - memory

  public:
    path: public/
    subdirectories:
      - backgrounds
      - icons
      - fonts
    forbidden:
      - business_logic

  generated:
    path: generated/
    committed: false

  uploads:
    path: uploads/
    purpose: temporary assets only

  documentation:
    path: docs/
    files:
      - Architecture_Bible.md
    subdirectories:
      - architecture/adr
      - architecture/migration-logs
      - rfc
      - migration
      - api

repository_v2:
  version: 2
  root: marketplace-infographic/
  tree:
    - app
    - components
    - docs
    - public
    - prisma
    - scripts
    - src
    - tests
    - config
  src:
    path: src/
    current_path: src/lib/
    modules:
      platform-core:
        responsibilities:
          - ProjectState
          - Architecture Registry
          - Versioning
          - Execution Context
          - Configuration
          - Platform Registry
          - Decision Trace
          - Architecture Metadata
      runtime:
        responsibilities:
          - Execution Graph
          - Scheduler
          - Retry
          - Events
          - Metrics
          - Cache
          - Node Execution
          - Checkpoint Manager
      contracts:
        responsibilities:
          - immutable Specifications
        forbidden:
          - business_logic
      platforms:
        responsibilities:
          - business intelligence only
        modules:
          - Research
          - Knowledge
          - Commercial
          - Creative
          - Visual
          - Rendering
          - Vision
          - Learning
          - Governance
      providers:
        responsibilities:
          - external integrations
          - Provider Adapter
        implementations:
          - Flux
          - GPTImage
          - Imagen
      sdk:
        responsibilities:
          - Platform SDK
          - Plugin SDK
          - Skill SDK
          - Registry SDK
      assets:
        responsibilities:
          - Asset Manager
          - Asset Graph
          - Storage
          - Metadata
          - Versioning
          - Cache
      infrastructure:
        responsibilities:
          - Logger
          - Metrics
          - Configuration
          - Database
          - Storage
          - Queue
          - Telemetry
      shared:
        responsibilities:
          - pure reusable utilities
        forbidden:
          - business_logic
      legacy:
        purpose: compatibility
        forbidden_imports:
          - runtime
          - platforms
        allowed:
          - adapters only
  app:
    path: app/
    current_path: src/app/
    forbidden:
      - business_logic
      - knowledge
      - commercial_logic
      - rendering
      - vision
      - learning
      - runtime
  tests:
    path: tests/
    suites:
      - unit
      - integration
      - architecture
      - golden
      - performance
      - marketplace
  config:
    path: config/
    files:
      - architecture.yaml
      - runtime.yaml
      - providers.yaml
      - platforms.yaml
      - marketplaces.yaml
      - learning.yaml
  migration_score:
    current: 70
    reuse: 90
    rewrite: 10
    risk: LOW
  success_criteria:
    - repository communicates architecture
    - onboarding_under_15_minutes

platform_core:
  status: CRITICAL
  priority: MAXIMUM
  wave: 1
  path: src/lib/platform-core/
  business_logic: forbidden
  responsibilities:
    - platform registration
    - platform discovery
    - project lifecycle
    - architecture metadata
    - execution context
    - configuration
    - versioning
    - dependency registry
    - ProjectState
    - DecisionTrace
  interfaces:
    - IPlatform
    - IProvider
    - ISkill
    - IPlugin
    - IRuntime
    - IRegistry
    - IProjectState
  files:
    - PlatformCore.ts
    - ProjectState.ts
    - ProjectContext.ts
    - ProjectMetadata.ts
    - ArchitectureRegistry.ts
    - PlatformRegistry.ts
    - ProviderRegistry.ts
    - VersionManager.ts
    - ConfigurationManager.ts
    - ExecutionContext.ts
  config_files:
    - architecture.yaml
    - runtime.yaml
    - providers.yaml
    - marketplaces.yaml
    - learning.yaml
    - plugins.yaml
  performance:
    project_state_creation_ms: 5
    registry_lookup_ms: 1
  refactor:
    reuse: 95
    rewrite: 5

file_specifications:
  - module: design-process
    path: src/lib/design-process/
    status: refactor
    priority: critical
    importance: 5
    wave: 5
    purpose: creative transformation only
    remove:
      - execution control
      - prompt generation
      - render preparation
      - filesystem operations
      - provider selection
      - asset loading
    move:
      scene_planning: visual-platform
      prompt_builder: provider-adapter
      execution_flow: runtime
      asset_resolution: asset-platform
      configuration: platform-core
    keep:
      - creative scoring
      - creative memory
      - concept generator
      - concept evaluator
      - creative critic
    create:
      - CreativeSpec
      - CreativeDecision
      - CreativeAlternative
      - CreativeMetrics
      - CreativeConfidence
    pipeline:
      - KnowledgeSpec
      - CommercialSpec
      - Creative Reasoning
      - Concept Generation
      - Creative Critic
      - CreativeSpec
    imports_forbidden:
      - render-engine
      - provider
      - prompt
      - filesystem
      - legacy
    imports_allowed:
      - contracts
      - runtime
      - shared
      - sdk
    depends_on:
      - Knowledge
      - Commercial
      - Runtime
    returns: CreativeSpec
    directives:
      - DSP-001
      - DSP-002
      - DSP-003
      - DSP-004
    rollback: restore DesignBrief adapter

  - module: design-governance
    path: src/lib/design-governance/
    status: keep
    priority: critical
    importance: 5
    keep:
      - Constitution
      - Blueprint Lock
      - Validators
      - Resolver
      - Rules
      - Architecture Checks
    remove:
      - Professional Score
      - Image Quality
      - Marketplace Score
      - Commercial Score
    move:
      professional_score: vision-platform
      marketplace_validation: vision-platform
      image_validation: vision-platform
    add:
      - ProjectState Validation
      - Specification Validation
      - Runtime Validation
      - Execution Validation
      - Dependency Validation
    create:
      - GovernanceRuntime
      - GovernanceEvents
      - GovernanceReport
    directives:
      - GOV-002
      - GOV-003
    success: governance validates architecture only

  - module: render-engine
    path: src/lib/render-engine/
    status: keep
    priority: critical
    importance: 5
    wave: 7
    keep:
      - background generation
      - shadow generation
      - composition
      - export
      - provider communication
    remove:
      - creative decisions
      - commercial decisions
      - knowledge usage
      - prompt strategy
    move:
      prompt: provider-adapter
      business: commercial
      creative: creative
      visual: visual-platform
    create:
      - RenderGraph
      - RenderNode
      - RetryNode
      - NodeExecutor
    directives:
      - REN-002
      - REN-003
    success: rendering executes RenderBlueprint only

runtime:
  id: RuntimeV2
  path: src/lib/runtime/
  components:
    - ProjectState
    - ProjectSnapshot
    - ExecutionContext
    - EventBus
    - VersionManager
    - DesignGraph
    - PlatformRegistry
  rules:
    sole_orchestrator: true
    legacy_imports: forbidden

contracts:
  path: src/lib/contracts/
  base: BaseSpecification
  immutable: true
  specs:
    - ProductBrief
    - ResearchSpec
    - KnowledgeSpec
    - CommercialSpec
    - CreativeSpec
    - VisualBlueprint
    - RenderBlueprint
    - LearningReport
  trace:
    - DecisionTrace
    - CreativeDecision
    - CreativeAlternative
    - ConfidenceScore

platforms:
  - id: project-intelligence
    version: 1
    status: planned
    reuse: 0
    rewrite: 100
    owner: Platform Team
    input:
      - ProductBrief
    output:
      - ProductBrief
    depends_on:
      - Runtime
    validation:
      immutable: true
      decision_trace: true
      confidence: false
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns ProductBrief
      - no prompt generation
      - runtime compatible

  - id: research
    version: 1
    status: planned
    reuse: 70
    rewrite: 30
    owner: Research Team
    input:
      - ProductBrief
    output:
      - ResearchSpec
    depends_on:
      - Runtime
      - Contracts
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns ResearchSpec
      - no prompt generation
      - runtime compatible

  - id: knowledge
    version: 2
    status: refactor
    reuse: 85
    rewrite: 15
    owner: Knowledge Team
    path: src/lib/design/
    input:
      - ResearchSpec
    output:
      - KnowledgeSpec
    depends_on:
      - Runtime
      - Contracts
    files:
      create:
        - KnowledgeRuntime.ts
        - KnowledgeQuery.ts
        - KnowledgeGraph.ts
      modify:
        - genome/
        - registry/
      delete: []
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns KnowledgeSpec
      - single immutable output
      - no prompt generation
      - runtime compatible
    rollback:
      action: restore previous platform

  - id: commercial
    version: 2
    status: refactor
    reuse: 90
    rewrite: 10
    owner: Commercial Team
    path: src/lib/platforms/commercial/
    input:
      - ProductBrief
      - KnowledgeSpec
    output:
      - CommercialSpec
    depends_on:
      - Knowledge
      - Runtime
    files:
      create:
        - CommercialSpec.ts
        - CommercialRuntime.ts
      modify:
        - Strategy.ts
        - Hierarchy.ts
      delete:
        - DesignBrief.ts
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
      - marketplace
    acceptance:
      - returns CommercialSpec
      - no prompt generation
      - runtime compatible
    rollback:
      action: restore previous platform
    events:
      emit:
        - CommercialCompleted
      output:
        - Event
        - Metrics
        - DecisionTrace

  - id: creative
    version: 2
    status: refactor
    reuse: 65
    rewrite: 35
    owner: Creative Team
    path: src/lib/design-process/
    input:
      - CommercialSpec
    output:
      - CreativeSpec
    depends_on:
      - Commercial
      - Runtime
    files:
      create:
        - CreativeSpec.ts
        - DecisionTrace.ts
        - CreativeDecision.ts
        - CreativeAlternative.ts
        - ConfidenceScore.ts
      modify:
        - concept-generator/
        - creative-evaluator/
        - scene-selection/
      delete:
        - DesignBrief.ts
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns CreativeSpec
      - concepts only
      - no prompt generation
      - runtime compatible

  - id: visual
    version: 1
    status: planned
    reuse: 50
    rewrite: 50
    owner: Visual Team
    input:
      - CreativeSpec
    output:
      - VisualBlueprint
    depends_on:
      - Creative
      - Runtime
    extracts:
      - Scene
      - Lighting
      - Camera
      - Composition
      - Typography
      - OverlayZones
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns VisualBlueprint
      - rendering receives VisualBlueprint
      - no prompt generation

  - id: rendering
    version: 2
    status: refactor
    reuse: 60
    rewrite: 40
    owner: Rendering Team
    path: src/lib/render-engine/
    input:
      - VisualBlueprint
      - RenderBlueprint
    output:
      - RenderBlueprint
    depends_on:
      - Visual
      - ProviderAdapter
      - Runtime
    files:
      create:
        - RenderGraph.ts
        - RenderNodes.ts
        - RetryEngine.ts
        - NodeScheduler.ts
      modify:
        - background/
        - composition/
        - shadow/
        - export/
      delete: []
    keeps:
      - Background
      - Composition
      - Provider
      - Shadow
      - Export
    moves_out:
      - business_logic
      - creative_logic
      - prompt
    validation:
      immutable: true
      decision_trace: true
      confidence: false
      versioned: true
    tests:
      - unit
      - integration
      - architecture
      - marketplace
    acceptance:
      - executes RenderBlueprint only
      - node level retry
      - no prompt generation outside adapter

  - id: vision
    version: 1
    status: planned
    reuse: 40
    rewrite: 60
    owner: Vision Team
    input:
      - RenderBlueprint
    output:
      - ValidationReport
    depends_on:
      - Rendering
      - Runtime
    moves_in:
      - ProfessionalScore
      - MarketplaceValidation
      - CommercialValidation
      - TypographyValidation
      - CompositionValidation
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
      - marketplace
    acceptance:
      - every PNG validated

  - id: learning
    version: 1
    status: refactor
    reuse: 80
    rewrite: 20
    owner: Learning Team
    path: src/lib/feedback/
    input:
      - ValidationReport
      - ProjectState
    output:
      - LearningReport
    depends_on:
      - Vision
      - Knowledge
      - Runtime
    merges:
      - Feedback
      - Genome
      - Memory
      - Learning
    validation:
      immutable: true
      decision_trace: true
      confidence: true
      versioned: true
    tests:
      - unit
      - integration
      - architecture
    acceptance:
      - returns LearningReport
      - knowledge automatically updated

  - id: governance
    version: 2
    status: keep
    reuse: 80
    rewrite: 20
    owner: Governance Team
    path: src/lib/design-governance/
    validation_rules:
      - ProjectState
      - Specification
      - Execution
      - Architecture
    moves_out:
      - ProfessionalScore
    acceptance:
      - architecture authority

  - id: provider-adapter
    version: 1
    status: planned
    reuse: 70
    rewrite: 30
    owner: Platform Team
    path: src/lib/platforms/provider-adapter/
    input:
      - RenderBlueprint
    output:
      - ProviderPrompt
    sole_prompt_compiler: true
    depends_on:
      - Contracts
      - Runtime
    moves_in:
      - src/lib/prompt/
    validation:
      immutable: true
      decision_trace: false
      confidence: false
      versioned: true
    acceptance:
      - one prompt compiler
      - providers replaceable

providers:
  - id: Flux
    capabilities:
      - image
      - background
    limitations:
      - text_rendering
      - typography
    prompt_path: provider-adapter/mapping/flux

  - id: OpenAI
    capabilities:
      - image
    limitations:
      - typography
    prompt_path: provider-adapter/mapping/openai

assets:
  - type: product
    version: 3
    storage: Asset Platform
  - type: background
    version: 1
    storage: Asset Platform
  - type: overlay
    version: 1
    storage: Asset Platform
  - type: export
    version: 1
    storage: Asset Platform

project_state:
  chain:
    - ProductBrief
    - ResearchSpec
    - KnowledgeSpec
    - CommercialSpec
    - CreativeSpec
    - VisualBlueprint
    - RenderBlueprint
  immutable: true
  snapshot: ProjectSnapshot

events:
  - name: CommercialCompleted
    platform: commercial
    emit:
      - Event
      - Metrics
      - DecisionTrace
  - name: CreativeCompleted
    platform: creative
    emit:
      - Event
      - Metrics
      - DecisionTrace
  - name: RenderCompleted
    platform: rendering
    emit:
      - Event
      - Metrics
  - name: LearningCompleted
    platform: learning
    emit:
      - Event
      - LearningReport

phases:
  - id: 1
    name: Platform Core
    components:
      - platform-core
      - runtime
      - contracts
      - ProjectState
    waves: [1, 2]
    status: pending

  - id: 2
    name: Knowledge
    components:
      - knowledge
      - research
      - marketplace
      - genome
      - memory
    waves: [3]
    reuse_only: true
    status: pending

  - id: 3
    name: Commercial Creative Visual
    components:
      - commercial
      - creative
      - visual
    waves: [4, 5, 6]
    status: pending

  - id: 4
    name: Rendering Provider Vision
    components:
      - rendering
      - provider-adapter
      - vision
    waves: [7, 8]
    status: pending

  - id: 5
    name: Learning
    components:
      - learning
      - feedback
      - optimization
    waves: [9]
    status: pending

  - id: 6
    name: Legacy Cleanup
    components:
      - legacy-cleanup
      - dead-code
      - architecture-validation
    waves: [10]
    status: pending

  - id: 7
    name: Performance
    components:
      - performance
      - caching
      - parallel-runtime
      - gpu-optimization
    status: pending

  - id: 8
    name: Extensibility
    components:
      - plugin-sdk
      - skills
      - external-providers
      - marketplace-extensions
    status: pending

final_acceptance:
  architecture_score_min: 98
  coverage_min: 95
  criteria:
    - legacy_isolated
    - runtime_isolated
    - contracts_immutable
    - prompt_isolated
    - vision_mandatory
    - learning_active
    - replay_supported
    - rollback_supported
    - decision_trace_complete
    - project_state_immutable

waves:
  - id: 1
    name: Platform Core
    tasks:
      - platform-core
      - contracts
      - runtime
      - registry
      - ProjectState
      - EventBus
      - VersionManager
    forbidden:
      - refactor business logic
      - delete legacy
  - id: 2
    name: Contracts
    tasks:
      - BaseSpecification
      - immutable DTO
      - replace duplicated DTO
      - ProjectState
      - Versioning
  - id: 3
    name: Research & Knowledge
    reuse_only: true
  - id: 4
    name: Commercial
    platform: commercial
  - id: 5
    name: Creative
    platform: creative
  - id: 6
    name: Visual
    platform: visual
  - id: 7
    name: Rendering
    platform: rendering
  - id: 8
    name: Vision
    platform: vision
  - id: 9
    name: Learning
    platform: learning
  - id: 10
    name: Legacy Cleanup
    remove:
      - DesignBrief
      - duplicate DTO
      - old prompt builders
      - dead code

directives:
  - id: DSL-001
    title: Architecture DSL root document
    priority: HIGH
    wave: 0
    status: completed
    files:
      create:
        - docs/architecture/architecture.yaml
    checks:
      - compile
      - validate_yaml
    success:
      architecture_score_min: 98

  - id: EXEC-001
    title: Cursor Execution Protocol
    priority: Critical
    wave: 0
    status: completed
    files:
      create:
        - docs/architecture/migration-report-template.md
        - docs/architecture/migration-logs/
    checks:
      - compile
    success:
      architecture_score_min: 98

  - id: PLAN-001
    title: Implementation Plan (Phases 1-8)
    priority: Critical
    wave: 0
    status: completed
    files:
      modify:
        - docs/architecture/architecture.yaml
    checks:
      - validate_yaml
    success:
      architecture_score_min: 98

  - id: REP-001
    title: Move files into canonical repository structure
    priority: HIGH
    wave: 1
    phase: 1
    status: blocked
    requires:
      - RUN-001
      - DTO-001
    files:
      create:
        - src/lib/platform-core/
        - src/lib/runtime/
        - src/lib/contracts/
        - src/lib/platforms/
        - src/lib/providers/
        - src/lib/sdk/
        - src/lib/assets/
        - src/lib/legacy/
    rules:
      - do not change business logic
    checks:
      - compile
      - unit
      - architecture
    success:
      repository_matches_bible: true

  - id: REP-002
    title: Normalize repository structure (Part 27 v2)
    priority: HIGH
    wave: 1
    phase: 1
    status: refactor
    requires:
      - REP-001
    rules:
      - move files only when architecture requires
      - do not rewrite implementation
    targets:
      - src/platform-core/
      - src/runtime/
      - src/contracts/
      - src/platforms/
      - src/providers/
      - src/infrastructure/
      - src/shared/
      - tests/
      - config/
    checks:
      - compile
      - unit
      - architecture
    success:
      repository_follows_bible: true

  - id: PC-001
    title: Create ProjectState
    priority: Critical
    wave: 1
    status: completed
    files:
      create:
        - src/lib/platform-core/project-state/ProjectState.ts
    checks:
      - unit
    success:
      immutable: true

  - id: PC-002
    title: Create Architecture Registry
    priority: Critical
    wave: 1
    status: completed
    files:
      create:
        - src/lib/platform-core/registry/ArchitectureRegistry.ts
    checks:
      - unit

  - id: PC-003
    title: Create Version Manager
    priority: Critical
    wave: 1
    status: completed
    files:
      create:
        - src/lib/platform-core/versioning/VersionManager.ts
    checks:
      - unit

  - id: PC-004
    title: Create Configuration Manager
    priority: Critical
    wave: 1
    status: completed
    files:
      create:
        - src/lib/platform-core/configuration/ConfigurationManager.ts
    checks:
      - unit

  - id: PC-005
    title: Replace object passing with ProjectState
    priority: Critical
    wave: 1
    status: in_progress
    requires:
      - PC-001
      - RUN-001
    checks:
      - integration
      - architecture

  - id: DSP-001
    title: Replace DesignBrief with CreativeSpec
    priority: Critical
    wave: 5
    phase: 3
    status: blocked
    module: design-process
    requires:
      - DTO-001
