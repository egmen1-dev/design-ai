  part: 39
  version: "1.0"
  priority: maximum
  model: microkernel
  separation:
    kernel: execution
    platforms: intelligence
    providers: implementation
  microkernel_contains:
    - runtime
    - project_state
    - registry
    - scheduler
    - execution_graph
    - cache
    - metrics
    - events
    - configuration
    - security
