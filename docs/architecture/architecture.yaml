  extensions:
    - commercial
    - creative
    - knowledge
    - research
    - vision
    - learning
    - marketplace
    - rendering
    - providers
    - assets
  microkernel_law: kernel never imports extensions; extensions register themselves
  boot_process:
    - load_configuration
    - initialize_kernel
    - load_runtime
    - load_registries
    - load_extensions
    - resolve_dependencies
    - health_check
    - ready
  shutdown:
    - stop_runtime
    - flush_events
    - flush_metrics
    - persist_state
    - unload_extensions
    - shutdown_kernel
  failure_isolation:
    steps:
      - platform_crash
      - unload_platform
      - retry
      - continue_runtime
    rule: kernel never crashes because extension crashes
  hot_reload:
    platform_supports:
      - unload
      - reload
      - upgrade
    without_kernel_restart: true
  success_criteria:
    - kernel_uptime_independent_from_platform_stability

