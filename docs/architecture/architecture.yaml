evolution:
  purpose: continuous evolution without breaking existing functionality
  principles:
    - never rewrite when extension is possible
    - backward compatibility unless RFC approves breaking change
    - platforms evolve independently
    - no hidden coupling
    - new capabilities must be measurable
  maturity_model:
    - id: 1
      name: Working Prototype
    - id: 2
      name: Modular Architecture
    - id: 3
      name: Platform Architecture
    - id: 4
      name: Operating System
      current_target: true
    - id: 5
      name: Self Improving Design Intelligence
      future_target: true
  versioning_required:
    - platform
    - contract
    - decision
    - asset
    - knowledge_object
  feature_introduction:
    - RFC
    - ADR
    - architecture_approval
    - implementation_directive
    - implementation
    - architecture_validation
    - release
  deprecation_policy:
    steps:
      - marked
      - adapter_created
      - migration
      - removal
    immediate_deletion: forbidden
  backward_compatibility:
    adapters_required: true
    minimum_major_releases: 1
  success_criteria:
    - architecture evolves without large rewrites

release:
  purpose: identical lifecycle for every release
  lifecycle:
    - release_candidate
    - architecture_validation
    - unit_tests
    - integration_tests
    - marketplace_tests
    - golden_tests
    - performance_tests
    - manual_review
    - release
  types:
