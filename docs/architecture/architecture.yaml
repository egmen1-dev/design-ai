design_ai_constitution:
  part: 38
  version: "1.0"
  status: canonical
  priority: maximum
  preamble:
    purpose: commercially successful visual communication
    system_purpose: decision generation
    rendering: implementation detail only
  articles:
    - id: I
      title: Architecture
      principle: Architecture has priority over implementation
    - id: II
      title: Single Source Of Truth
      principle: Architecture Bible is SSOT; code follows architecture
    - id: III
      title: Responsibility
      principle: Every module owns one responsibility; no overlap
    - id: IV
      title: Immutability
      principle: Specifications, Blueprints, and ProjectState are immutable
    - id: V
      title: Platform Independence
      principle: Platforms communicate only through Specifications
    - id: VI
      title: Runtime
      principle: Only Runtime controls execution
    - id: VII
      title: Knowledge
      principle: Knowledge independent of rendering; survives provider replacement
    - id: VIII
      title: Prompts
      principle: Prompt is implementation detail, never architecture
    - id: IX
      title: Providers
      principle: Providers interchangeable; architecture never depends on provider
    - id: X
      title: Learning
      principle: Every completed project improves the system
    - id: XI
      title: Traceability
      principle: Decisions explainable, reproducible, versioned
    - id: XII
      title: Reuse
      principle: Reuse before rewrite; extension before replacement; migration before deletion
    - id: XIII
      title: Quality
      principle: Commercial quality over implementation elegance
    - id: XIV
      title: Validation
      principle: Architecture automatically validated
    - id: XV
      title: Evolution
      principle: Evolve through RFC, ADR, Implementation Directives only
    - id: XVI
      title: Backward Compatibility
      principle: Breaking changes require migration path
    - id: XVII
      title: Security
      principle: Minimum required permissions per platform
    - id: XVIII
      title: Observability
      principle: Metrics, Events, Decision Trace, Artifacts on every execution
    - id: XIX
      title: Simplicity
      principle: Fewer concepts, abstractions, dependencies; justify complexity
    - id: XX
      title: Mission
      principle: World's best commercial design intelligence system

