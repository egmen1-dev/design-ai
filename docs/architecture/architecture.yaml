    - RFC
    - ADR
    - migration_guide
    - architecture_report
  artifacts:
    - architecture_report
    - migration_report
    - performance_report
    - compatibility_report
  rollback:
    required: true
    every_release_reversible: true
  success_criteria:
    - every release reproducible

observability:
  purpose: nothing inside Design AI OS is hidden
  platform_emits:
    - events
    - metrics
    - decision_trace
    - warnings
    - errors
    - artifacts
  project_stores:
